<!-- Interface simple pour afficher les données -->
<!-- Interface améliorée pour afficher les données -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenu Dynamique</title>
  <!-- Inclure Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    async function fetchData(endpoint, elementId) {
        try {
            const response = await fetch(endpoint);
            const data = await response.json();
            document.getElementById(elementId).innerHTML = generateHTMLFromJSON(data);
        } catch (error) {
            document.getElementById(elementId).innerText = "Erreur lors du chargement des données.";
            console.error(error);
        }
    }
  
    function generateHTMLFromJSON(data) {
        let html = '';
        // Si c'est un tableau, on le parcourt et on affiche chaque élément
        if (Array.isArray(data)) {
            html += '<ul class="list-group">';
            data.forEach((item, index) => {
                // Affiche les objets sous forme de chaîne formatée
                html += `<li class="list-group-item"><strong>Élément ${index}:</strong> ${formatValue(item)}</li>`;
            });
            html += '</ul>';
        } else if (typeof data === 'object') {
            // Si c'est un objet, on parcourt ses clés
            html += '<ul class="list-group">';
            for (let key in data) {
                html += `<li class="list-group-item"><strong>${key}:</strong> ${formatValue(data[key])}</li>`;
            }
            html += '</ul>';
        } else {
            // Autre type (primitif)
            html = data.toString();
        }
        return html;
    }
  
    // Fonction pour formater les valeurs ; si c'est un objet, on le transforme en JSON formaté
    function formatValue(value) {
        if (typeof value === 'object') {
            return `<pre>${JSON.stringify(value, null, 2)}</pre>`;
        }
        return value;
    }
  
    window.onload = () => {
        fetchData('/api/events', 'events');
        fetchData('/api/news', 'news');
    };
  </script>
  
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Contenu Dynamique</h1>
    <div class="row">
      <div class="col-md-6">
        <div class="card mb-4">
          <div class="card-header">Événements</div>
          <div class="card-body">
            <div id="events">Chargement...</div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card mb-4">
          <div class="card-header">Actualités</div>
          <div class="card-body">
            <div id="news">Chargement...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Inclure Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
